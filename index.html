<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACT Math Practice Quiz 2</title>
<style>
  :root{
    --bg:#0f172a; --card:#172033; --card2:#111827; --text:#f8fafc;
    --muted:#cbd5e1; --accent:#60a5fa; --border:#334155;
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  .wrap{max-width:920px;margin:auto;padding:24px}
  h1{margin-bottom:6px}
  .subtitle{color:var(--muted);margin-top:0}
  .topbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:20px 0}
  .progress-shell{height:12px;background:#253149;border-radius:999px;overflow:hidden}
  .progress{height:100%;width:0;background:var(--accent);transition:.2s}
  .timer{font-weight:700;background:var(--card2);border:1px solid var(--border);padding:8px 12px;border-radius:10px}
  .question{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin:16px 0}
  .question h3{margin-top:0;font-size:18px}
  .choice{display:block;width:100%;text-align:left;margin:9px 0;padding:12px 14px;border-radius:10px;
    border:1px solid #475569;background:#111827;color:var(--text);cursor:pointer;font-size:15px}
  .choice:hover{border-color:var(--accent)}
  .choice.selected{outline:2px solid var(--accent);background:#172554}
  .choice.correct{outline:2px solid var(--good);background:#052e16}
  .choice.incorrect{outline:2px solid var(--bad);background:#450a0a}
  .explanation{display:none;margin-top:12px;padding:12px;border-left:4px solid var(--accent);background:#0b1220;color:#e2e8f0}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
  button.action{padding:12px 18px;border:0;border-radius:10px;font-weight:700;cursor:pointer}
  #submitBtn{background:var(--accent);color:#07111f}
  #clearBtn{background:#334155;color:white}
  #results{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin:20px 0}
  .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}
  .stat{background:#111827;padding:12px;border-radius:10px;border:1px solid var(--border)}
  .small{color:var(--muted);font-size:14px}
  @media(max-width:600px){.wrap{padding:14px}.topbar{grid-template-columns:1fr}.timer{justify-self:start}}
</style>
</head>
<body>
<div class="wrap">
  <h1>ACT Math Practice Quiz 2</h1>
  <p class="subtitle">25 original ACT-style questions • Algebra • Functions • Geometry • Statistics • Modeling</p>

  <div class="topbar">
    <div>
      <div class="small" id="progressText">0 of 25 answered</div>
      <div class="progress-shell"><div class="progress" id="progress"></div></div>
    </div>
    <div class="timer" id="timer">27:00</div>
  </div>

  <div id="quiz"></div>

  <div class="controls">
    <button class="action" id="submitBtn">Submit Quiz</button>
    <button class="action" id="clearBtn">Clear Answers</button>
  </div>

  <div id="results"></div>
</div>

<script>
const questions = [
 {cat:"Algebra", q:"1. Solve for x: 5x − 7 = 3x + 19.", a:["6","10","13","26"], c:2,
  e:"Subtract 3x from both sides: 2x − 7 = 19. Add 7: 2x = 26. Divide by 2, so x = 13."},
 {cat:"Modeling", q:"2. A taxi charges a $4 starting fee plus $2.50 per mile. Which expression gives the cost, in dollars, of a ride of m miles?", a:["4m + 2.50","2.50m + 4","6.50m","2.50(m + 4)"], c:1,
  e:"The fixed fee is 4 and the mileage charge is 2.50 for each of m miles, so C = 2.50m + 4."},
 {cat:"Geometry", q:"3. The angles of a triangle measure (x + 10)°, (2x + 5)°, and (3x − 15)°. What is x?", a:["25","30","35","40"], c:1,
  e:"Triangle angles total 180°. (x+10)+(2x+5)+(3x−15)=180 gives 6x=180, so x=30."},
 {cat:"Functions", q:"4. If g(x) = 2x² − 3x + 1, what is g(−2)?", a:["3","9","15","19"], c:2,
  e:"g(−2)=2(4)−3(−2)+1=8+6+1=15."},
 {cat:"Statistics", q:"5. The median of 4, 7, 9, 12, 18, 21, and 30 is:", a:["9","12","14","18"], c:1,
  e:"There are 7 ordered values, so the median is the 4th value: 12."},
 {cat:"Algebra", q:"6. Which value of x satisfies 4(x − 3) + 2 = 2x + 10?", a:["8","10","12","14"], c:1,
  e:"Expand: 4x−12+2=2x+10, so 4x−10=2x+10. Then 2x=20 and x=10."},
 {cat:"Geometry", q:"7. A rectangular garden is 15 feet long and 8 feet wide. A path 1 foot wide is built inside the garden along all four edges. What is the area, in square feet, of the remaining inner rectangle?", a:["78","91","104","120"], c:0,
  e:"The path removes 1 foot from each side, so inner dimensions are 13 by 6. Area = 13×6 = 78."},
 {cat:"Modeling", q:"8. A $240 tablet is marked down by 25%. What is the sale price before tax?", a:["$60","$180","$195","$215"], c:1,
  e:"A 25% discount means paying 75% of the price. 0.75×240 = 180."},
 {cat:"Algebra", q:"9. If 3y/5 = 18, what is y?", a:["10","24","30","45"], c:2,
  e:"Multiply both sides by 5: 3y=90. Divide by 3: y=30."},
 {cat:"Geometry", q:"10. A circle has diameter 14 centimeters. What is its circumference?", a:["7π cm","14π cm","28π cm","49π cm"], c:1,
  e:"Circumference is πd. With diameter 14, C=14π centimeters."},
 {cat:"Functions", q:"11. For h(x) = 3x − 8, which value of x makes h(x) = 13?", a:["5","7","13","21"], c:1,
  e:"Set 3x−8=13. Then 3x=21, so x=7."},
 {cat:"Statistics", q:"12. A bag contains 5 red, 3 blue, and 2 green marbles. One marble is selected at random. What is the probability it is blue?", a:["1/5","3/10","1/3","3/5"], c:1,
  e:"There are 10 marbles total and 3 are blue, so the probability is 3/10."},
 {cat:"Algebra", q:"13. What is the solution to the system y = 2x + 1 and y = −x + 10?", a:["(2, 5)","(3, 7)","(4, 6)","(5, 5)"], c:1,
  e:"Set the expressions equal: 2x+1=−x+10. Then 3x=9, x=3, and y=7."},
 {cat:"Geometry", q:"14. A right triangle has legs of length 7 and 24. What is the length of the hypotenuse?", a:["25","26","30","31"], c:0,
  e:"By the Pythagorean theorem, c²=7²+24²=49+576=625, so c=25."},
 {cat:"Modeling", q:"15. A car travels 156 miles in 3 hours at a constant rate. At that rate, how far will it travel in 5 hours?", a:["208 miles","240 miles","260 miles","312 miles"], c:2,
  e:"The rate is 156/3=52 miles per hour. In 5 hours it travels 52×5=260 miles."},
 {cat:"Algebra", q:"16. Simplify: (3x²)(4x³).", a:["7x⁵","12x⁵","12x⁶","12x⁹"], c:1,
  e:"Multiply coefficients: 3×4=12. Add exponents of x: x²×x³=x⁵. Result: 12x⁵."},
 {cat:"Functions", q:"17. The line y = −3x + 11 has which slope?", a:["−11","−3","3","11"], c:1,
  e:"In slope-intercept form y=mx+b, the coefficient m is the slope. Here m=−3."},
 {cat:"Geometry", q:"18. A cylinder has radius 3 inches and height 5 inches. What is its volume?", a:["15π in³","30π in³","45π in³","90π in³"], c:2,
  e:"Cylinder volume is πr²h. Using r=3 and h=5 gives π(9)(5)=45π cubic inches."},
 {cat:"Statistics", q:"19. The scores 72, 78, 84, 86, and 90 have a mean of:", a:["80","82","84","86"], c:1,
  e:"Their sum is 410. Divide by 5: 410/5=82."},
 {cat:"Algebra", q:"20. Which expression is equivalent to x² − 9?", a:["(x−9)(x+1)","(x−3)(x+3)","(x−3)²","(x−9)²"], c:1,
  e:"This is a difference of squares: x²−3²=(x−3)(x+3)."},
 {cat:"Modeling", q:"21. A population of 800 increases by 15%. What is the new population?", a:["815","880","900","920"], c:3,
  e:"15% of 800 is 120. Add the increase: 800+120=920."},
 {cat:"Geometry", q:"22. Two similar triangles have corresponding side lengths 6 and 9. If another side of the smaller triangle is 10, what is the corresponding side of the larger triangle?", a:["12","15","16","18"], c:1,
  e:"The scale factor is 9/6=1.5. Multiply 10 by 1.5 to get 15."},
 {cat:"Algebra", q:"23. If |2x − 5| = 9, what are the possible values of x?", a:["−7 and 2","−2 and 7","2 and 7","−2 and 2"], c:1,
  e:"Solve 2x−5=9 to get x=7, and 2x−5=−9 to get x=−2."},
 {cat:"Functions", q:"24. A function is defined by f(x) = x + 4. What is f(f(3))?", a:["7","10","11","14"], c:2,
  e:"First f(3)=7. Then f(7)=11."},
 {cat:"Geometry", q:"25. In the coordinate plane, what is the midpoint of the segment joining (−4, 6) and (8, −2)?", a:["(2, 2)","(2, 4)","(4, 2)","(6, 4)"], c:0,
  e:"Average the x-coordinates and y-coordinates: ((−4+8)/2, (6−2)/2)=(2,2)."}
];

const quiz = document.getElementById("quiz");
const selected = Array(questions.length).fill(null);

questions.forEach((item,i)=>{
  const box=document.createElement("section");
  box.className="question";
  box.innerHTML=`<h3>${item.q}</h3><div class="small">${item.cat}</div>`;
  item.a.forEach((ans,j)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.type="button";
    b.textContent=String.fromCharCode(65+j)+". "+ans;
    b.onclick=()=>{
      if(document.body.dataset.submitted==="1") return;
      selected[i]=j;
      [...box.querySelectorAll(".choice")].forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
      updateProgress();
    };
    box.appendChild(b);
  });
  const exp=document.createElement("div");
  exp.className="explanation";
  exp.id=`exp${i}`;
  box.appendChild(exp);
  quiz.appendChild(box);
});

function updateProgress(){
  const n=selected.filter(v=>v!==null).length;
  document.getElementById("progressText").textContent=`${n} of ${questions.length} answered`;
  document.getElementById("progress").style.width=`${(n/questions.length)*100}%`;
}

let seconds=27*60;
const timerEl=document.getElementById("timer");
const timer=setInterval(()=>{
  if(document.body.dataset.submitted==="1") return;
  seconds--;
  const m=Math.floor(seconds/60), s=seconds%60;
  timerEl.textContent=`${m}:${String(s).padStart(2,"0")}`;
  if(seconds<=0){ clearInterval(timer); submitQuiz(); }
},1000);

function submitQuiz(){
  if(document.body.dataset.submitted==="1") return;
  document.body.dataset.submitted="1";
  clearInterval(timer);
  let score=0;
  const cats={};
  document.querySelectorAll(".question").forEach((box,i)=>{
    const item=questions[i];
    if(!cats[item.cat]) cats[item.cat]={right:0,total:0};
    cats[item.cat].total++;
    const buttons=[...box.querySelectorAll(".choice")];
    buttons[item.c].classList.add("correct");
    if(selected[i]===item.c){ score++; cats[item.cat].right++; }
    else if(selected[i]!==null){ buttons[selected[i]].classList.add("incorrect"); }
    const exp=document.getElementById(`exp${i}`);
    exp.style.display="block";
    exp.innerHTML=`<strong>Explanation:</strong> ${item.e}`;
  });
  const pct=Math.round(score/questions.length*100);
  const breakdown=Object.entries(cats).map(([k,v])=>
    `<div class="stat"><strong>${k}</strong><br>${v.right}/${v.total} correct (${Math.round(v.right/v.total*100)}%)</div>`
  ).join("");
  const r=document.getElementById("results");
  r.style.display="block";
  r.innerHTML=`<h2>Score: ${score}/${questions.length} (${pct}%)</h2>
    <p>${pct>=80?"Strong work. Review the missed questions and make sure the method, not just the answer, makes sense.":
    pct>=60?"Good practice. The category breakdown below shows where another round will help most.":
    "Use the explanations below as a study guide, then retry similar problems rather than memorizing these answers."}</p>
    <div class="breakdown">${breakdown}</div>`;
  r.scrollIntoView({behavior:"smooth"});
}

document.getElementById("submitBtn").onclick=submitQuiz;
document.getElementById("clearBtn").onclick=()=>{
  if(document.body.dataset.submitted==="1"){ location.reload(); return; }
  selected.fill(null);
  document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
  updateProgress();
};
</script>
</body>
</html>
