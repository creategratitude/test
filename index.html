choice.selected{border:3px solid var(--blue);padding:11px 13px;background:#edf4ff}.selected .letter{background:var(--blue);color:#fff;border-color:var(--blue)}.choice.eliminated{text-decoration:line-through;opacity:.45}.cross{border:0;padding:5px;font-size:18px;min-width:30px}.answer-input{width:220px;max-width:100%;font-size:22px;padding:12px;border:2px solid #5b6879;border-radius:5px}.footer{height:81px;border-top:4px dashed var(--yellow);background:#fafbfc;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 32px}.footer .navbuttons{display:flex;gap:12px}.navigator{font-size:14px;min-width:165px}.autosave{font-size:12px;color:var(--muted);max-width:220px}.modal-overlay{position:fixed;inset:0;background:#14233b66;display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}.modal{background:white;padding:26px;border-radius:12px;max-width:660px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 80px #15274055}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.modal-head h2{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:9px;margin:22px 0}.grid button{padding:10px 2px;position:relative}.grid button.answered{background:#dfeaff;border-color:#4782d6}.grid button.current{outline:2px solid #182c48}.grid button.marked:after{content:'⚑';position:absolute;top:-10px;right:-3px;color:#946500;background:white;font-size:15px}.break-screen{min-height:100vh;background:#f5f7fa;display:grid;place-items:center;text-align:center;padding:24px}.break-screen .card{max-width:580px;width:100%;padding:45px}.break-clock{font-size:58px;font-weight:bold;color:var(--navy);font-variant-numeric:tabular-nums;margin:30px}.results{background:#f5f7fa;min-height:100vh}.results-header{display:flex;justify-content:space-between;gap:20px;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}.stat strong{font-size:34px;color:var(--navy);display:block;margin:12px 0}.stats .card{padding:23px}.domain{display:grid;grid-template-columns:1fr 90px;gap:10px;margin:20px 0}.bar{height:8px;background:#e5eaf0;border-radius:6px;overflow:hidden;grid-column:1/-1}.bar span{display:block;background:#386fb2;height:100%}.review-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:30px 0 20px}.review-controls select{padding:9px;border:1px solid #aeb8c7;border-radius:5px}.review-card{margin-bottom:20px}.review-card .text{font-family:Georgia,serif;line-height:1.65;font-size:18px}.review-card .option-review{padding:10px;border:1px solid #e0e4e9;border-radius:5px;margin:8px 0;line-height:1.5}.correct{background:#edf8f1;border-color:#5da67d!important}.incorrect{background:#fff0f1;border-color:#c97b80!important}.explanation{margin-top:18px;padding:17px 20px;background:#f3f6fa;border-left:3px solid #5176a5;line-height:1.65}.report-actions{display:flex;gap:10px;flex-wrap:wrap}.calc-input{width:100%;padding:12px;font-size:20px;margin:18px 0 8px}.calc-output{font-size:22px;min-height:40px;margin:10px 0}.calc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:15px}.ref-grid p{padding:10px;background:#f4f6f9;margin:0}table{border-collapse:collapse;margin:20px 0;width:100%;font:15px Arial,sans-serif}th,td{border:1px solid #aeb5c0;padding:11px;text-align:left;line-height:1.4}th{background:#eef1f6}a{color:var(--blue)}.banner{background:#fff5d9;padding:12px 16px;border-radius:6px;font-size:14px;line-height:1.6}.module-list{padding-left:22px;font-size:14px;line-height:2}.tools-wrap{display:flex;gap:6px}.status{min-height:18px;color:var(--red);font-size:13px;margin-top:8px}@media(max-width:850px){h1{font-size:34px}.setup{grid-template-columns:1fr}.exam-header{height:auto;min-height:100px;padding:14px 16px}.exam-title{font-size:16px}.header-tools{flex-wrap:wrap;justify-content:flex-end}.tools-wrap button{font-size:12px;padding:8px}.test-body{height:auto;min-height:calc(100dvh - 181px);display:block}.passage{border-right:0;border-bottom:1px solid var(--line);padding:24px;font-size:18px;max-height:43vh}.question{padding:22px 24px;overflow:visible}.footer{position:sticky;bottom:0;padding:12px 14px;height:auto;min-height:81px}.autosave{display:none}.footer button{font-size:13px;padding:10px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:repeat(7,1fr)}.results-header{display:block}.timer{min-width:85px}.ref-grid{grid-template-columns:1fr}.wrap{padding-top:30px}.qbar{gap:3px}.exam-header .small{font-size:11px}}@media print{.report-actions,.review-controls,button,.sources{display:none!important}.results{background:white}.card{break-inside:avoid}.wrap{padding:0}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:28px}}
</style></head><body><main id="app"></main><div id="modal-root"></div>
<script>
const QUESTIONS = [
  {
    "id": "q1",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Words in context",
    "level": "Easy",
    "passage": "Because the astronomer’s initial calculation was based on only three observations, she described her conclusion as ______, emphasizing that additional measurements might lead her to revise it.",
    "prompt": "Which choice completes the text with the most logical and precise word?",
    "options": [
      "definitive",
      "tentative",
      "redundant",
      "impartial"
    ],
    "answer": 1,
    "explanation": "Tentative means provisional or subject to revision, matching the limited evidence. Definitive means settled; redundant means repetitive; impartial means unbiased."
  },
  {
    "id": "q2",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Words in context",
    "level": "Medium",
    "passage": "Unlike older maps, which omitted seasonal waterways, the new atlas ______ these features, showing even channels that carry water for only a few weeks each year.",
    "prompt": "Which choice completes the text with the most logical and precise word?",
    "options": [
      "obscures",
      "disputes",
      "incorporates",
      "exaggerates"
    ],
    "answer": 2,
    "explanation": "Incorporates means includes. The contrast concerns omission versus inclusion, not accuracy or exaggeration."
  },
  {
    "id": "q3",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Words in context",
    "level": "Medium",
    "passage": "The two historians agree on the sequence of events but offer ______ accounts of their causes: one emphasizes economic pressures, whereas the other attributes the changes primarily to political rivalry.",
    "prompt": "Which choice completes the text with the most logical and precise word?",
    "options": [
      "divergent",
      "incidental",
      "exhaustive",
      "interchangeable"
    ],
    "answer": 0,
    "explanation": "Divergent means differing. The historians disagree about causes even though they agree about chronology. Nothing establishes that either account is exhaustive."
  },
  {
    "id": "q4",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Words in context",
    "level": "Hard",
    "passage": "The historian’s description of the archive as “silent” is not literal. Rather, it ______ the absence of ordinary laborers’ perspectives from a collection dominated by officials’ reports.",
    "prompt": "Which choice completes the text with the most logical and precise word?",
    "options": [
      "rectifies",
      "precludes",
      "discredits",
      "underscores"
    ],
    "answer": 3,
    "explanation": "Underscores means emphasizes. The description draws attention to the absence; it does not correct it, prevent it, or prove it false."
  },
  {
    "id": "q5",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Text structure and purpose",
    "level": "Medium",
    "passage": "Some restoration projects remove every trace of a building’s later alterations. Architect Mira Chen takes a different approach. In a converted warehouse, she retained a staircase added decades after the original construction, arguing that the addition revealed how successive occupants had used the space. To her, restoring a building can mean preserving evidence of change.",
    "prompt": "Which choice best states the main purpose of the text?",
    "options": [
      "To argue that warehouse conversions are less costly than other restoration projects",
      "To illustrate an approach to restoration that values a building’s accumulated history",
      "To explain why later additions are structurally stronger than original features",
      "To question whether architects can determine when a building was constructed"
    ],
    "answer": 1,
    "explanation": "The retained staircase exemplifies Chen’s view that later changes are part of a building’s history. Costs, structural strength, and uncertainty about dates are not discussed."
  },
  {
    "id": "q6",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Text structure and purpose",
    "level": "Medium",
    "passage": "For years, researchers inferred the diet of a vanished seabird from the shapes of its surviving beaks. <u>A recent analysis instead examined chemical signatures in preserved feathers.</u> The findings suggest that the bird fed farther offshore than the beak-based reconstructions had indicated.",
    "prompt": "Which choice best describes the function of the underlined sentence in the text as a whole?",
    "options": [
      "It provides the conclusion of the earlier studies.",
      "It explains why preserved feathers are always more reliable than bones.",
      "It introduces a different method whose results challenge an earlier inference.",
      "It identifies a flaw that invalidates every reconstruction of the bird’s diet."
    ],
    "answer": 2,
    "explanation": "The underlined sentence introduces the feather method; the following sentence explains its challenge to previous diet inferences. The passage does not make an absolute claim about reliability."
  },
  {
    "id": "q7",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Cross-text connections",
    "level": "Hard",
    "passage": "<b>Text 1</b><p>Digitizing rare manuscripts gives researchers far from major libraries access to materials they could not otherwise consult. For many historical questions, a high-resolution image provides the evidence a scholar needs.</p><b>Text 2</b><p>Digital images are invaluable, but they cannot fully represent an object. Differences in paper thickness or the pressure of a pen may reveal how a manuscript was produced. Such questions still require examining the physical document.</p>",
    "prompt": "How would the author of Text 2 most likely respond to Text 1?",
    "options": [
      "Digitization has made physical libraries unnecessary.",
      "Researchers should avoid digital images when studying history.",
      "High-resolution images cannot accurately reproduce handwriting.",
      "Digital access is useful, although some investigations require the original object."
    ],
    "answer": 3,
    "explanation": "Text 2 explicitly values digital images while identifying physical properties they cannot fully capture. It qualifies the usefulness of digitization rather than rejecting it."
  },
  {
    "id": "q8",
    "m": 0,
    "domain": "Craft and Structure",
    "skill": "Text structure and purpose",
    "level": "Hard",
    "passage": "The botanist did not claim that urban trees grew slowly because of pollution alone. Her team had also recorded soil compaction, limited root space, and irregular watering. By measuring these conditions separately, the team sought to distinguish the effects of factors that often occur together.",
    "prompt": "Which choice best states the main purpose of the text?",
    "options": [
      "To describe an effort to separate potentially overlapping explanations",
      "To establish that air pollution has no effect on urban trees",
      "To criticize researchers for collecting too many measurements",
      "To show that urban trees have adapted to compacted soil"
    ],
    "answer": 0,
    "explanation": "The focus is the design of a study that separates co-occurring factors. The text does not report results proving any factor harmless or showing adaptation."
  },
  {
    "id": "q9",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Central ideas",
    "level": "Easy",
    "passage": "A neighborhood library began lending basic repair tools alongside books. Staff expected the tools to appeal mainly to experienced hobbyists. Instead, many borrowers were first-time users who attended the library’s introductory workshops. The library subsequently expanded those workshops and began including illustrated instruction cards with each tool.",
    "prompt": "Which choice best states the main idea of the text?",
    "options": [
      "The library stopped lending books when demand for tools increased.",
      "Experienced hobbyists were the only people who borrowed tools.",
      "The library adjusted its support after discovering who used its tool collection.",
      "Illustrated cards eliminated the need for introductory workshops."
    ],
    "answer": 2,
    "explanation": "Unexpected demand from beginners led to more workshops and instruction cards. The other choices contradict or exceed the passage."
  },
  {
    "id": "q10",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Details",
    "level": "Easy",
    "passage": "To document changes in a coastal marsh, a research team photographed the same marked plots each spring for twelve years. The team chose spring because vegetation was easier to distinguish before summer growth obscured the boundaries between species. Using marked plots allowed the researchers to compare the same locations over time.",
    "prompt": "According to the text, why did the team take photographs in spring?",
    "options": [
      "It allowed them to distinguish vegetation more easily.",
      "It ensured that every species had finished growing.",
      "It removed the need to return to marked plots.",
      "It made twelve years of observations unnecessary."
    ],
    "answer": 0,
    "explanation": "The passage directly says spring growth made vegetation easier to distinguish. It does not say growth was finished."
  },
  {
    "id": "q11",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Command of evidence",
    "level": "Medium",
    "passage": "A researcher proposes that small rooftop gardens can provide food for pollinating insects even when the gardens are far from large parks. She compares observations from gardens located at varying distances from parks.",
    "prompt": "Which finding, if true, would most directly support the researcher’s proposal?",
    "options": [
      "The gardens nearest parks were larger than the other gardens.",
      "Several garden owners preferred flowering plants to vegetables.",
      "Large parks contained a greater variety of trees than rooftop gardens.",
      "Bees regularly collected pollen in rooftop gardens more than two kilometers from the nearest park."
    ],
    "answer": 3,
    "explanation": "Actual pollen collection in distant rooftop gardens directly supports the claim that those gardens provide food. Preferences and tree diversity do not test the claim."
  },
  {
    "id": "q12",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Quantitative evidence",
    "level": "Medium",
    "passage": "A team measured average seedling height after four weeks under three lighting conditions.<table><tr><th>Light each day</th><th>Average height (cm)</th></tr><tr><td>6 hours</td><td>8</td></tr><tr><td>10 hours</td><td>13</td></tr><tr><td>14 hours</td><td>14</td></tr></table>The team notes that increasing light duration was associated with greater height, but the increase in height was smaller for the second four-hour increment.",
    "prompt": "Which choice best uses data from the table to support the team’s observation?",
    "options": [
      "Height increased by the same amount with each four-hour increase.",
      "Height increased by 5 cm from 6 to 10 hours of light, but by only 1 cm from 10 to 14 hours.",
      "Seedlings receiving 14 hours of light were twice as tall as those receiving 6 hours.",
      "Seedlings receiving 10 hours of light were shorter than those receiving 6 hours."
    ],
    "answer": 1,
    "explanation": "The differences are 13 − 8 = 5 cm and 14 − 13 = 1 cm. These values support diminishing height gains for the second increment."
  },
  {
    "id": "q13",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Inferences",
    "level": "Medium",
    "passage": "A museum displayed two identical reproductions of a sculpture in separate rooms. One label identified its material as recycled industrial metal; the other provided only its dimensions. Visitors who saw the material label were more likely to discuss environmental issues in their written responses, even though both groups saw the same form. The results suggest that ______",
    "prompt": "Which choice best completes the text?",
    "options": [
      "a sculpture’s shape determines every response to it.",
      "visitors can always identify recycled metal by sight.",
      "context supplied by a label can influence how visitors interpret an artwork.",
      "environmental themes are present in all metal sculpture."
    ],
    "answer": 2,
    "explanation": "The only described difference is the label, and responses differed accordingly. This supports an influence of context, not universal claims about sculpture or perception."
  },
  {
    "id": "q14",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Command of evidence",
    "level": "Hard",
    "passage": "A literary scholar argues that a fictional narrator feels affection for a town while also recognizing its limitations.",
    "prompt": "Which quotation from the fictional work would most directly support the scholar’s argument?",
    "options": [
      "“I knew each crooked lane by heart and loved them still, though none seemed to lead beyond the lives we had already imagined.”",
      "“At dawn the town was hidden by a fog so dense that even the station clock disappeared.”",
      "“The new square was larger than the old one, and the market stalls had been moved to its eastern edge.”",
      "“I left without a glance behind me, grateful that I would never again hear those familiar bells.”"
    ],
    "answer": 0,
    "explanation": "Love of familiar lanes conveys affection, while their seeming inability to lead to new lives conveys limitations. The final quotation conveys rejection without the required affection."
  },
  {
    "id": "q15",
    "m": 0,
    "domain": "Information and Ideas",
    "skill": "Inferences",
    "level": "Hard",
    "passage": "An excavation uncovered fragments of a type of ceramic previously known only from a distant region. Chemical analysis showed that the fragments had been made from local clay, while their decorative patterns closely resembled those of the distant ceramics. The archaeologists therefore suggest that ______",
    "prompt": "Which choice best completes the text?",
    "options": [
      "all ceramics found at the site were imported.",
      "the distant region obtained its clay from the excavation site.",
      "decorative patterns cannot provide evidence of cultural contact.",
      "the style may have traveled between communities even when the finished objects did not."
    ],
    "answer": 3,
    "explanation": "Local clay supports local manufacture; a shared style suggests transmitted ideas or techniques. Neither long-distance clay shipments nor universal claims about imports follow."
  },
  {
    "id": "q16",
    "m": 0,
    "domain": "Standard English Conventions",
    "skill": "Subject–verb agreement",
    "level": "Easy",
    "passage": "The collection of letters written by the expedition’s members ______ an unusually detailed account of daily life at the camp.",
    "prompt": "Which choice completes the text so that it conforms to the conventions of Standard English?",
    "options": [
      "provide",
      "provides",
      "have provided",
      "were providing"
    ],
    "answer": 1,
    "explanation": "The subject is the singular collection, not the plural letters or members. Provides agrees with collection."
  },
  {
    "id": "q17",
    "m": 0,
    "domain": "Standard English Conventions",
    "skill": "Sentence boundaries",
    "level": "Medium",
    "passage": "The observatory was built far from the city ______ its remote location reduced interference from artificial light.",
    "prompt": "Which choice completes the text so that it conforms to the conventions of Standard English?",
    "options": [
      "center,",
      "center and,",
      "center;",
      "center which"
    ],
    "answer": 2,
    "explanation": "Both sides are independent clauses, so a semicolon joins them correctly. A comma alone creates a comma splice."
  },
  {
    "id": "q18",
    "m": 0,
    "domain": "Standard English Conventions",
    "skill": "Possessives",
    "level": "Medium",
    "passage": "Each of the two laboratories submitted a report. The committee then compared the two ______ conclusions before recommending further trials.",
    "prompt": "Which choice completes the text so that it conforms to the conventions of Standard English?",
    "options": [
      "laboratories’",
      "laboratory’s",
      "laboratories",
      "laboratories’s"
    ],
    "answer": 0,
    "explanation": "The conclusions belong to two laboratories. The plural possessive of laboratories is laboratories’ (apostrophe after s)."
  },
  {
    "id": "q19",
    "m": 0,
    "domain": "Standard English Conventions",
    "skill": "Modifiers",
    "level": "Medium",
    "passage": "After examining the aerial photographs, ______",
    "prompt": "Which choice completes the text so that it conforms to the conventions of Standard English?",
    "options": [
      "several previously unnoticed paths appeared to the researcher.",
      "the location of several paths was identified.",
      "there were several paths that the researcher identified.",
      "the researcher identified several previously unnoticed paths."
    ],
    "answer": 3,
    "explanation": "The opening modifier must describe the subject of the main clause: the researcher examined the photographs. The other subjects did not examine them."
  },
  {
    "id": "q20",
    "m": 0,
    "domain": "Standard English Conventions",
    "skill": "Verb tense",
    "level": "Medium",

function renderResults(){const s=summary(),weak=[...s.domains].sort((a,b)=>a.right/a.total-b.right/b.total).filter(d=>d.right<d.total).slice(0,3);$('app').innerHTML=`<div class="results"><div class="wrap"><div class="results-header"><div><div class="eyebrow">Your practice report · Form 01</div><h1>Test complete.</h1></div><div class="report-actions"><button onclick="downloadReport()">Download feedback</button><button onclick="window.print()">Print report</button><button onclick="$('app').innerHTML=landing()">New attempt</button></div></div><p class="intro">Use these results to decide what to practice next. Accuracy is based on every question in your selected test, including unanswered questions.</p><div class="stats"><div class="card stat"><span>Overall accuracy</span><strong>${Math.round(100*s.right/s.total)}%</strong><span>${s.right} of ${s.total} correct · ${s.unanswered} unanswered</span></div>${['Reading and Writing','Math'].map((name,i)=>{const qs=s.qs.filter(q=>i?q.m>=2:q.m<2);return `<div class="card stat"><span>${name}</span><strong>${qs.length?qs.filter(correct).length+' / '+qs.length:'—'}</strong><span>${qs.length?Math.round(100*qs.filter(correct).length/qs.length)+'% correct':'Not included in this attempt'}</span></div>`}).join('')}</div><div class="banner">${state.mode==='timed'?'Timed':'Untimed'} practice · Fixed form, not adaptive · No scaled SAT score. These original questions have not been statistically calibrated. Raw accuracy should not be converted into a 400–1600 score.</div><div class="setup"><section class="card"><h2>Skill breakdown</h2>${s.domains.map(d=>`<div class="domain"><span>${d.name}</span><b style="text-align:right">${d.right} / ${d.total}</b><div class="bar"><span style="width:${100*d.right/d.total}%"></span></div></div>`).join('')}</section><section class="card"><h2>What to work on next</h2>${weak.length?weak.map((d,i)=>`<p><b>${i+1}. ${d.name}</b><br>${advice[d.name]}</p>`).join(''):'<p>You answered every question correctly. Try an official adaptive Bluebook practice test next to assess performance on a new, calibrated form.</p>'}<p class="small">${s.unanswered?`${s.unanswered} question(s) were unanswered. Review pacing as well as content; an educated guess has no wrong-answer penalty.`:'You entered an answer for every question.'} Recommendations reflect this one attempt, not a diagnosis of your overall ability.</p></section></div><section class="card" style="margin-top:24px"><h2>Module results</h2><table><tr><th>Module</th><th>Correct</th><th>Unanswered</th><th>Recorded time</th></tr>${state.modules.map(m=>{const qs=list(m);return `<tr><td>${MODULES[m].name} ${MODULES[m].num}</td><td>${qs.filter(correct).length}/${qs.length}</td><td>${qs.filter(q=>!answered(q)).length}</td><td>${fmt(qs.reduce((v,q)=>v+(state.times[q.id]||0),0))}</td></tr>`}).join('')}</table><p class="small">Recorded time includes time with a question open, including time away while the page remains open. It is not a measure of active thinking; closing the browser can make these totals incomplete even though module deadlines continue.</p></section><div class="review-controls"><h2 style="margin:0 15px 0 0">Answer review</h2><label>Show <select id="review-filter" onchange="reviewFilter=this.value;renderReview()"><option value="missed">Missed & unanswered</option><option value="all">All questions</option><option value="flagged">Marked for review</option></select></label><label>Skill <select id="review-domain" onchange="reviewDomain=this.value;renderReview()"><option value="all">All skills</option>${s.domains.map(d=>`<option>${d.name}</option>`).join('')}</select></label></div><div id="review-list"></div><p class="small">Retaking the same questions can improve familiarity but does not independently measure progress. Use a new official form for a fresh score estimate.</p></div></div>`;$('review-filter').value=reviewFilter;$('review-domain').value=reviewDomain;renderReview()}
function renderReview(){const qs=activeQuestions().filter(q=>(reviewFilter==='all'||reviewFilter==='missed'&&!correct(q)||reviewFilter==='flagged'&&state.flags[q.id])&&(reviewDomain==='all'||q.domain===reviewDomain));$('review-list').innerHTML=qs.length?qs.map(q=>{const n=list(q.m).indexOf(q)+1,a=state.answers[q.id];return `<article class="card review-card"><span class="badge">${MODULES[q.m].name} · Module ${MODULES[q.m].num} · Question ${n}</span><h3>${correct(q)?'✓ Correct':answered(q)?'Incorrect':'Unanswered'} <span class="small">· ${q.skill} · ${q.level} (estimated)</span></h3>${q.passage?`<div class="text">${q.passage}</div>`:''}<p><b>${q.prompt}</b></p>${q.options?q.options.map((o,i)=>`<div class="option-review ${i===q.answer?'correct':a===i?'incorrect':''}"><b>${'ABCD'[i]}.</b> ${o}${i===q.answer?' <b>— Correct answer</b>':''}${a===i?' <b>— Your answer</b>':''}</div>`).join(''):`<p>Your answer: <b>${answered(q)?esc(a):'No response'}</b> · Correct answer: <b>${q.answer}</b></p>`}<div class="explanation"><b>Explanation</b><br>${q.explanation}</div></article>`}).join(''):'<div class="card"><p>No questions match this filter.</p></div>'}
function downloadReport(){const s=summary();let t=`SAT PRACTICE STUDIO — FORM 01\n${state.mode.toUpperCase()} / FIXED, NONADAPTIVE PRACTICE\n\nCorrect: ${s.right}/${s.total} (${Math.round(s.right/s.total*100)}%)\nUnanswered: ${s.unanswered}\nNo scaled SAT score: original, uncalibrated questions.\n\nSKILL BREAKDOWN\n`;s.domains.forEach(d=>t+=`${d.name}: ${d.right}/${d.total}\n`);t+='\nRECOMMENDED PRACTICE\n';[...s.domains].sort((a,b)=>a.right/a.total-b.right/b.total).filter(d=>d.right<d.total).slice(0,3).forEach(d=>t+=`${d.name}: ${advice[d.name]}\n\n`);t+='\nQUESTION REVIEW\n';s.qs.forEach(q=>{const a=state.answers[q.id];t+=`\n${MODULES[q.m].name} ${MODULES[q.m].num}, Q${list(q.m).indexOf(q)+1}: ${correct(q)?'Correct':answered(q)?'Incorrect':'Unanswered'}\n${q.skill}\nYour answer: ${answered(q)?q.options?'ABCD'[a]+'. '+q.options[a]:a:'No response'}\nCorrect answer: ${q.options?'ABCD'[q.answer]+'. '+q.options[q.answer]:q.answer}\n${q.explanation}\n`});const blob=new Blob([t],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SAT_Practice_Feedback.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('modal-root').firstChild){const nodes=[...$('modal-root').querySelectorAll('button,input,a,select')].filter(x=>!x.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('beforeunload',()=>{chargeTime();save()});
$('app').innerHTML=landing();setInterval(tick,1000);
</script></body></html>
